name: Bug Report
description: Report a reproducible defect or bug
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please verify the issue has not been reported before opening a new ticket.
        For security vulnerability reports, refer to [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: Bug Description
      description: Provide a clear and concise description of the bug.
      placeholder: Describe what happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Create or join a room with code '...'
        2. Advance to phase '...'
        3. Execute action '...'
        4. Observe unexpected state or error '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console Logs or Network Output
      description: Paste relevant browser console output or network traces.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS version, device type, or PWA standalone mode.
      placeholder: iOS 17.5 Safari PWA, Chrome 125 macOS, etc.
    validations:
      required: true
