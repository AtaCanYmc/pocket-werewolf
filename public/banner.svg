<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0f1523" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>

    <radialGradient id="moonGlow" cx="85%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#3730a3" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="bloodGlow" cx="15%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#881337" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bg)" rx="16" />
  <rect width="1200" height="420" fill="url(#moonGlow)" rx="16" />
  <rect width="1200" height="420" fill="url(#bloodGlow)" rx="16" />

  <!-- Subtle Border -->
  <rect width="1198" height="418" x="1" y="1" fill="none" stroke="#1e293b" stroke-width="1.5" rx="15" />

  <!-- Star Dust Particles -->
  <circle cx="120" cy="60" r="1" fill="#ffffff" opacity="0.4" />
  <circle cx="280" cy="40" r="1.5" fill="#ffffff" opacity="0.6" />
  <circle cx="420" cy="90" r="1" fill="#ffffff" opacity="0.3" />
  <circle cx="750" cy="50" r="1.5" fill="#ffffff" opacity="0.5" />
  <circle cx="920" cy="80" r="2" fill="#818cf8" opacity="0.8" />
  <circle cx="1080" cy="45" r="1" fill="#ffffff" opacity="0.4" />
  <circle cx="150" cy="350" r="1.5" fill="#ffffff" opacity="0.3" />
  <circle cx="980" cy="320" r="1" fill="#ffffff" opacity="0.5" />
  <circle cx="1120" cy="260" r="1.5" fill="#ffffff" opacity="0.4" />

  <!-- Left Content: Brand & Headings -->
  <g transform="translate(80, 75)">
    <!-- Badge / Tag -->
    <rect width="210" height="28" rx="14" fill="#881337" fill-opacity="0.35" stroke="#e11d48" stroke-width="1" />
    <text x="14" y="18" fill="#fda4af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">⚡ REAL-TIME PWA GAME</text>

    <!-- Main Title -->
    <text x="0" y="80" fill="url(#textGrad)" font-family="'Cinzel', Georgia, serif" font-size="52" font-weight="900" letter-spacing="2">POCKET WEREWOLF</text>

    <!-- Subtitle -->
    <text x="0" y="120" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
      Serverless, Real-Time Multiplayer Mafia &amp; Werewolf Game
    </text>

    <!-- Tech Badges Group -->
    <g transform="translate(0, 165)">
      <!-- React Badge -->
      <rect width="90" height="28" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="45" y="18" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚛️ React 18</text>

      <!-- TypeScript Badge -->
      <rect x="100" width="115" height="28" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="157" y="18" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">📘 TypeScript</text>

      <!-- Tailwind Badge -->
      <rect x="225" width="115" height="28" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="282" y="18" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">🎨 Tailwind CSS</text>

      <!-- Supabase Badge -->
      <rect x="350" width="110" height="28" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="405" y="18" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Supabase</text>

      <!-- PWA Badge -->
      <rect x="470" width="85" height="28" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="512" y="18" fill="#a78bfa" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">📱 PWA</text>
    </g>

    <!-- Supported Languages -->
    <g transform="translate(0, 225)">
      <text x="0" y="15" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="600" letter-spacing="1">LOCALIZED IN:</text>
      <text x="110" y="15" fill="#e2e8f0" font-family="sans-serif" font-size="13">🇬🇧 English  •  🇹🇷 Türkçe  •  🇫🇷 Français  •  🇩🇪 Deutsch</text>
    </g>
  </g>

  <!-- Right Visual: Werewolf Mascot Card & Moon -->
  <g transform="translate(870, 60)">
    <!-- Glowing Crescent Moon -->
    <circle cx="180" cy="60" r="45" fill="#818cf8" fill-opacity="0.15" filter="url(#glow)" />
    <circle cx="180" cy="60" r="35" fill="#cbd5e1" fill-opacity="0.9" />
    <circle cx="195" cy="50" r="32" fill="#0b101d" />

    <!-- 3D Card Stack -->
    <!-- Back Card 2 -->
    <g transform="translate(10, 30) rotate(12)">
      <rect width="180" height="240" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2" />
      <rect width="160" height="220" x="10" y="10" rx="12" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-dasharray="3,3" />
      <text x="90" y="130" font-size="44" text-anchor="middle">🧙‍♀️</text>
    </g>

    <!-- Back Card 1 -->
    <g transform="translate(20, 20) rotate(-6)">
      <rect width="180" height="240" rx="16" fill="#0f172a" stroke="#475569" stroke-width="2" />
      <rect width="160" height="220" x="10" y="10" rx="12" fill="#1e293b" fill-opacity="0.5" stroke="#64748b" stroke-dasharray="3,3" />
      <text x="90" y="130" font-size="44" text-anchor="middle">🔮</text>
    </g>

    <!-- Front Werewolf Card -->
    <g transform="translate(45, 10)">
      <rect width="190" height="250" rx="18" fill="url(#cardGrad)" stroke="#e11d48" stroke-width="2" filter="url(#glow)" />
      
      <!-- Inner Frame -->
      <rect width="170" height="230" x="10" y="10" rx="14" fill="#0b0f19" stroke="#be123c" stroke-width="1" />

      <!-- Role Icon / Avatar -->
      <circle cx="95" cy="85" r="45" fill="#881337" fill-opacity="0.4" stroke="#e11d48" stroke-width="1.5" />
      <text x="95" y="102" font-size="48" text-anchor="middle">🐺</text>

      <!-- Role Name -->
      <text x="95" y="165" fill="#ffffff" font-family="'Cinzel', Georgia, serif" font-size="16" font-weight="900" letter-spacing="1.5" text-anchor="middle">WEREWOLF</text>

      <!-- Team Badge -->
      <rect x="40" y="185" width="110" height="22" rx="11" fill="#e11d48" fill-opacity="0.25" stroke="#e11d48" stroke-width="1" />
      <text x="95" y="200" fill="#fca5a5" font-family="sans-serif" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">EVIL TEAM</text>
    </g>
  </g>
</svg>
